# AssayMAP 96AM head — PROFILE TEMPLATE
#
# This is a TEMPLATE, not a working profile. Everything head-specific is filled
# in; everything instrument-specific is blank and must be set for your machine.
#
# You must supply before use:
#   connection.address        your Bravo's IP
#   teachpoints               all nine, taught on your deck — they are ZERO here
#   axes.X/Y.homing_offset    from your instrument's own homing calibration
#
# Already correct for any AssayMAP head, and derived from decoded VWorks traffic
# cross-checked against Agilent's own profile and documentation:
#   axes.W                    100 mm / 250 uL syringe, 0.240625 mm per uL
#   axes.W.darwin_calibration_offset   1.44375 mm — the plunger's flag offset.
#                             Verify on your instrument: after homing W, Jog/Teach
#                             should read 0.
#   head.teach_tip_length_mm  55.5, the Agilent LT250 teach tip
#   current_limits            press force per channel count
#   safety.cartridge_shuck_*  the gripper stripper-plate motion
#
# Generating this from your own VWorks profile gives you the instrument-specific
# values directly; see the AssayMAP notes referenced in the pull request.
